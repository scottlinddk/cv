<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal CV and portfolio of a frontend developer." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CV</title>
    <script>
      // Apply the saved colour theme before first paint to avoid a flash.
      try {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
        else theme = null;
        // @scttlnd/ui's Caffeine theme reads data-fds-mode; without a saved choice follow the OS.
        var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) root.setAttribute('data-fds-mode', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
